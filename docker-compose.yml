name: zkrx-proof-server

services:
  proof-server:
    # Pinned to 8.1.0 to match the ledger-v8 8.1.0 dependency
    image: midnightntwrk/proof-server:8.1.0
    container_name: zkrx-proof-server
    command: ["midnight-proof-server -v"]
    ports:
      - "6300:6300"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      RUST_BACKTRACE: "full"
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/6300"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
