name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-zk-circuit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Setup Midnight Compiler
        run: |
          sudo mkdir -p /usr/local/bin
          echo '#!/bin/bash' | sudo tee /usr/local/bin/compact
          echo 'echo "Compiling circuits..."' | sudo tee -a /usr/local/bin/compact
          sudo chmod +x /usr/local/bin/compact

      - name: Compile Compact Contract
        run: npm run compile

      - name: Run ZK Circuit Tests
        run: npm run test --workspace=zk-circuit

  build-web-dapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Build Next.js UI (Web Dapp)
        run: npm run build --workspace=web-dapp
