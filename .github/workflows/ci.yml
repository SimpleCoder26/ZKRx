name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-zk-circuit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Setup Midnight Compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/compact update 0.31.1

      - name: Compile Compact Contract
        run: npm run compile

      - name: Run ZK Circuit Tests
        run: npm run test --workspace=zk-circuit

  build-web-dapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Build Next.js UI (Web Dapp)
        run: npm run build --workspace=web-dapp
