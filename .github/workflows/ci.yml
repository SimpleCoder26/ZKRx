name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Install Compact Compiler
        run: npm install -g @midnight-ntwrk/compact-compiler || echo "Compact compiler install failed — using pre-compiled artifacts"

      - name: Compile ZK Circuits (Midnight)
        run: npm run compile --workspace=zk-circuit || echo "Compact compilation skipped — using pre-compiled managed/ artifacts"

      - name: Run ZK Circuit Tests
        run: npm run test --workspace=zk-circuit

      - name: Build Next.js UI (Web Dapp)
        run: npm run build --workspace=web-dapp
